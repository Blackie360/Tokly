[package]
name = "tokly"
version = "0.2.0"
edition = "2021"
default-run = "tokly"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokly-tracker = { path = "../crates/tracker" }
rfd = "0.15"
