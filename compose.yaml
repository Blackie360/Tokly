services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tokly
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tokly"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-tokly.sql:ro
      - tokly_postgres:/var/lib/postgresql/data

volumes:
  tokly_postgres:
