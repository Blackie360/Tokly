name: Publish SDK

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'sdk-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/sdk/package.json').version")"
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          if [[ "${package_version}" != "${tag_version}" ]]; then
            echo "Release tag ${tag_version} does not match package version ${package_version}."
            exit 1
          fi

      - name: Run SDK tests
        run: npm test -- tests/sdk.test.ts

      - name: Build SDK
        run: npm run build --workspace @blackie360/tokly

      - name: Inspect package contents
        run: npm pack --workspace @blackie360/tokly --dry-run

      - name: Publish to npm
        run: npm publish --workspace @blackie360/tokly --access public
