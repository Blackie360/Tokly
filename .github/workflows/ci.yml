name: Tokly
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tokly-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node website/verify.mjs
  clipboard:
    name: Clipboard history (macOS universal)
    runs-on: macos-15
    defaults:
      run:
        working-directory: clipboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clipboard/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipboard/src-tauri
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build --target universal-apple-darwin --bundles app --no-sign
      - run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/Tokly.app Tokly-clipboard-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tokly-clipboard-macos-universal-unsigned
          path: clipboard/Tokly-clipboard-universal.zip
          retention-days: 14
