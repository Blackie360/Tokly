name: Tokly desktop
on:
  pull_request:
  push:
    branches: [main, 'codex/tokly-*']
  workflow_dispatch:
concurrency:
  group: tokly-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/tracker
      - run: npm ci
      - run: cargo fmt --manifest-path crates/tracker/Cargo.toml --check
      - run: cargo test --manifest-path crates/tracker/Cargo.toml --locked
      - run: cargo clippy --manifest-path crates/tracker/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles app --no-sign
      - run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/${{ matrix.target }}/release/bundle/macos/Tokly.app Tokly-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tokly-macos-${{ matrix.target }}-unsigned
          path: Tokly-${{ matrix.target }}.zip
          retention-days: 14
