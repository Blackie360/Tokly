name: Tokly
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tokly-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
  clipboard:
    name: App (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            rust-targets: aarch64-apple-darwin, x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles app --no-sign
            artifact: clipboard/Tokly-macos-universal.zip
          - name: Windows x64
            os: windows-latest
            build-args: --bundles nsis --no-sign
            artifact: clipboard/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            os: ubuntu-24.04
            build-args: --bundles deb
            artifact: clipboard/src-tauri/target/release/bundle/deb/*.deb
    defaults:
      run:
        shell: bash
        working-directory: clipboard
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # The Ubuntu mirror sometimes stalls for minutes; fail fast and retry instead of hanging.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTIONS: -o Acquire::Retries=4 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxkbcommon-dev libssl-dev build-essential file
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clipboard/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipboard/src-tauri
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri -- build ${{ matrix.build-args }}
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/Tokly.app Tokly-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tokly-${{ runner.os }}-unsigned
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
