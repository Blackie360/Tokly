name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokly-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_VERCEL_DEPLOYMENTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_CLI_VERSION: 58.5.1
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@${VERCEL_CLI_VERSION}

      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build production artifact
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}")"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Deployed to ${deployment_url}"
