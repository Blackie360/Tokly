name: Release
# Builds Tokly for macOS, Windows and Linux and attaches the files to a GitHub release.
# Start it by pushing a tag such as clipboard-v0.1.0, or by hand for a dry run that
# only uploads workflow artifacts.
#
# The macOS build is signed and notarized only when these repository secrets exist:
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD     Apple ID and an app-specific password
#   APPLE_TEAM_ID
# Without them it is ad-hoc signed, and the release notes say so.
# The Windows installer is not code-signed, so SmartScreen warns on first run.
# After publishing, the install scripts served by the website are run against the
# new release on Linux and Windows.
on:
  push:
    tags: ['clipboard-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            rust-targets: aarch64-apple-darwin, x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles app
          - name: Windows x64
            os: windows-latest
            build-args: --bundles nsis
          - name: Linux x64
            os: ubuntu-24.04
            build-args: --bundles deb
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    defaults:
      run:
        shell: bash
        working-directory: clipboard
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # The Ubuntu mirror sometimes stalls for minutes; fail fast and retry instead of hanging.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTIONS: -o Acquire::Retries=4 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTIONS update
          sudo apt-get $APT_OPTIONS install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libxkbcommon-dev libssl-dev build-essential file
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clipboard/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipboard/src-tauri
      - run: npm ci
      - name: Read version and check it matches the tag
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "clipboard-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version" >&2
            exit 1
          fi
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build, sign and notarize (macOS with a Developer ID)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build ${{ matrix.build-args }}
      - name: Build
        if: runner.os != 'macOS' || env.HAS_APPLE_SIGNING != 'true'
        run: npm run tauri -- build ${{ matrix.build-args }} --no-sign
      - name: Collect files
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p out
          case "$RUNNER_OS" in
            macOS)
              ditto -c -k --sequesterRsrc --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/Tokly.app "out/Tokly-$version-macos-universal.zip" ;;
            Windows)
              cp src-tauri/target/release/bundle/nsis/*.exe "out/Tokly-$version-windows-x64-setup.exe" ;;
            Linux)
              cp src-tauri/target/release/bundle/deb/*.deb "out/Tokly-$version-linux-amd64.deb" ;;
          esac
          cd out
          for file in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "$file.sha256"
            cat "$file.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Tokly-${{ runner.os }}
          path: clipboard/out/*
          if-no-files-found: error
  publish:
    name: Publish the GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: |
          version="${GITHUB_REF_NAME#clipboard-v}"
          {
            echo "Tokly $version, a clipboard history for the menu bar and system tray."
            echo
            echo "## Install"
            echo
            echo "- **Windows 10 or later (x64):** \`irm https://tokly.blackielabs.com/install.ps1 | iex\` in PowerShell, or run \`Tokly-$version-windows-x64-setup.exe\`."
            echo "- **Linux (Debian, Ubuntu, amd64):** \`curl -fsSL https://tokly.blackielabs.com/install.sh | sh\`, or install \`Tokly-$version-linux-amd64.deb\`."
            echo "- **macOS 12 or later (Apple Silicon and Intel):** unzip \`Tokly-$version-macos-universal.zip\` and move Tokly to Applications."
            echo
            echo "## Good to know"
            echo
            echo "- Windows and Linux are early builds: installed and started in automated tests, not yet on many real machines."
            echo "- The Windows installer is not code-signed, so SmartScreen may warn."
            if [ "$HAS_APPLE_SIGNING" != "true" ]; then
              echo "- The macOS app is not signed with a Developer ID or notarized; macOS will block it until you allow it in System Settings, Privacy and Security."
            fi
            echo "- Linux cannot yet skip copies that password managers mark as concealed."
            echo "- Each file has a \`.sha256\` beside it."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "Tokly $version" --notes-file notes.md --latest
  verify-install:
    name: Install from the published release (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Run install.sh
        if: runner.os == 'Linux'
        run: |
          sh website/public/install.sh
          command -v tokly
          dpkg -s tokly | grep -E '^(Package|Version|Status)'
      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./website/public/install.ps1
          $exe = Join-Path $env:LOCALAPPDATA 'Tokly\tokly.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          Write-Host "Installed: $exe"
